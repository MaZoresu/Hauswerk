name: Prüfen

# Bei jedem Push und Pull Request: Tests, hassfest (Home-Assistant-Prüfung) und HACS-Prüfung
on:
  push:
  pull_request:
  workflow_dispatch:

# Sicherheit: nur Lesen, Actions fest auf geprüfte Commits (nicht auf Tags/Branches, die jemand umbiegen könnte),
# kein Zugriffstoken in .git/config der Läufe. Es gibt keine Secrets in diesem Repository.
permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Logik- und Rauchtests
        run: python -m pytest -q tests
      - name: Python-Syntax aller Dateien
        run: python -m compileall -q custom_components
      - name: Versionen gleich (manifest.json und Panel)
        run: |
          M=$(jq -r .version custom_components/hauswerk/manifest.json)
          P=$(grep -oP 'const VERSION = "\K[^"]+' custom_components/hauswerk/frontend/hauswerk-panel.js)
          echo "manifest $M · Panel $P"
          test "$M" = "$P"
      - name: CHANGELOG hat einen Abschnitt für die Version
        run: |
          M=$(jq -r .version custom_components/hauswerk/manifest.json)
          grep -q "^## $M " CHANGELOG.md || { echo "::error::In CHANGELOG.md fehlt „## $M“"; exit 1; }

  panel:
    name: Panel-Klicktests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pytest voluptuous playwright
      - run: python -m playwright install --with-deps chromium
      - name: Alle Seiten, Fenster und Widgets im Browser; gesendete Befehle gegen die Schemas von api.py
        run: python -m pytest -q tests/test_panel_ui.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-11

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11
        with:
          category: integration
          # Beschreibung, Themen und Lizenz braucht HACS nur für die Aufnahme in den HACS-Standardkatalog
          ignore: description topics license
