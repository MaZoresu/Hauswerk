    if (msg.type === "hauswerk/heizen/report") return { ...report(msg.days), _analysis: {"a1": {"verdict": "weak", "facts": {"ok_pct": 65, "dev": -0.7, "valve": 75, "full_pct": 37, "over_pct": 0, "heat_h": 35.0, "rate": 0.4, "ok_cold": 45, "ok_mild": 80, "pause_h": 1.2, "openings": 7}, "findings": [{"level": "warn", "title": "Heizleistung reicht nicht", "text": "Der Raum erreicht nur in 65 % der Komfortzeit sein Soll, obwohl das Ventil im Schnitt 75 % offen ist und 37 % der Heizzeit fast ganz offen steht. Mögliche Gründe: Heizkörper zu klein für den Raum, Vorlauftemperatur/Heizkurve zu niedrig, Luft im Heizkörper oder fehlender hydraulischer Abgleich."}, {"level": "warn", "title": "Reicht bei Frost nicht", "text": "An kalten Tagen (unter 3 °C außen) wird der Komfort nur in 45 % der Zeit erreicht, an milden in 80 %. Die Heizkurve ist im kalten Bereich zu flach – Steilheit an der Heizung leicht erhöhen."}, {"level": "warn", "title": "Heizt langsam auf", "text": "Gelernt: 0.4 °C pro Stunde. Für Heizkörper ist das wenig – Vorheizen startet deshalb früh."}]}, "b2": {"verdict": "good", "facts": {"ok_pct": 100, "dev": 0.4, "valve": 18, "full_pct": 0, "over_pct": 19, "heat_h": 35.0, "rate": 0.25, "ok_cold": null, "ok_mild": 100, "pause_h": 1.2, "openings": 7}, "findings": [{"level": "ok", "title": "Heizleistung passt", "text": "Soll in 100 % der Komfortzeit erreicht, Ø +0.4 °C, Ventil im Schnitt 18 %."}, {"level": "info", "title": "Oft überheizt", "text": "In 19 % der Zeit war es mehr als 1 °C wärmer als gewollt. Gründe: Sonne oder andere Wärmequellen, die Trägheit der Fußbodenheizung (früher absenken) oder ein Thermostat, das zu kalt misst. Spart Energie, wenn behoben."}]}} };
    if (msg.type === "hauswerk/heizen/settings/save") return Object.assign(settings, msg.settings);
    if (msg.type === "hauswerk/heizen/room/save") { const r = { ...msg.room, id: msg.room.id || "neu_" + Date.now() }; rooms[r.id] = r; return r; }
    if (msg.type === "history/history_during_period") return {};
    if (msg.type === "energy/get_prefs") return { energy_sources: [
      { type: "grid", flow_from: [{ stat_energy_from: "sensor.smartmeter_bezug", stat_cost: null, entity_energy_price: null, number_energy_price: 0.32 }],
        flow_to: [{ stat_energy_to: "sensor.smartmeter_einspeisung", number_energy_price: 0.082 }], cost_adjustment_day: 0 },
      { type: "solar", stat_energy_from: "sensor.wechselrichter_ertrag_heute" },
      { type: "battery", stat_energy_from: "sensor.speicher_entladen", stat_energy_to: "sensor.speicher_geladen" } ], device_consumption: [] };
    if (msg.type === "energy/solar_forecast") {
      const wh = {}; const d0 = new Date(); d0.setHours(0, 0, 0, 0);
      for (let i = 0; i < 48; i++) { const t = new Date(d0.getTime() + i * 3600e3); const h = t.getHours(); wh[t.toISOString()] = Math.round(Math.max(0, Math.sin(((h - 7) / 10) * Math.PI)) * 2400); }
      return { fs1: { wh_hours: wh } };
    }
    if (msg.type === "recorder/statistics_during_period" && msg.period === "5minute") {
      const out = {}; const start = Date.parse(msg.start_time), end = Date.now();
      for (const id of msg.statistic_ids) {
        out[id] = [];
        for (let t = start; t < end; t += 300e3) {
          const h = new Date(t).getHours();
          const base = { "sensor.smartmeter_wirkleistung": h < 5 ? 210 + (t / 300e3 % 7) * 6 : 600, "sensor.waermepumpe_leistung": h < 5 ? 60 : 400, "sensor.wallbox_leistung": h < 5 ? 4 : 0 }[id] ?? 0;
          out[id].push({ start: t, end: t + 300e3, mean: base });
        }
      }
      return out;
    }
    if (msg.type === "recorder/statistics_during_period") {
      const out = {}; const start = Date.parse(msg.start_time), end = Date.parse(msg.end_time);
      const step = msg.period === "hour" ? 3600e3 : msg.period === "day" ? 86400e3 : 30 * 86400e3;
      for (const id of msg.statistic_ids) {
        out[id] = [];
        for (let t = start, i = 0; t < end; t += step, i++) {
          const d = new Date(t); const h = d.getHours();
          const sun = msg.period === "hour" ? Math.max(0, Math.sin(((h - 6) / 13) * Math.PI)) * 3.2 : msg.period === "day" ? 14 + 9 * Math.sin(i) : 300 + 200 * Math.sin((d.getMonth() - 2) / 12 * 2 * Math.PI);
          const use = msg.period === "hour" ? (h >= 6 && h <= 22 ? 0.9 + (h === 12 || h === 19 ? 1.1 : 0) : 0.35) : msg.period === "day" ? 13 : 380;
          const self = Math.min(sun, use * 0.85);
          const v = { "sensor.wechselrichter_ertrag_heute": sun, "sensor.smartmeter_bezug": Math.max(0, use - self) * 0.8, "sensor.smartmeter_einspeisung": Math.max(0, sun - self) * 0.85,
            "sensor.speicher_entladen": Math.max(0, use - self) * 0.2, "sensor.speicher_geladen": Math.max(0, sun - self) * 0.15 }[id] || 0;
          out[id].push({ start: t, end: t + step, change: v });
        }
      }
      return out;
    }
    if (msg.type === "hauswerk/notify/test") return { results: (msg.channels || []).map((c) => ({ channel: c, ok: true })) };
    if (msg.type === "person/create") { states["person." + msg.name.toLowerCase()] = st("unknown", { friendly_name: msg.name }); return { id: msg.name.toLowerCase(), name: msg.name }; }
    if (msg.type === "hauswerk/log/get") {
      const T = (m) => Date.now() / 1000 - m * 60;
      return { days: 14, entries: [
        { ts: T(26 * 60), cat: "settings", title: "Einstellungen geändert", why: "Frostschutz, Darstellung · Panel · von Jens" },
        { ts: T(50), cat: "settings", mod: "rollwerk", title: "Profil „Süd mit Hitze“ geändert", why: "Zwei Stufen aus → an, Stufe 1 50 % → 40 %, Beschatten ab außen 22 °C → 21 °C · 2 Rollläden · Panel · von Jens" },
        { ts: T(35), cat: "shutter", mod: "rollwerk", room: "a1", title: "Wohnzimmer auf 25 %", why: "Beschattung · vorher 100 %" },
        { ts: T(20), cat: "manual", mod: "rollwerk", room: "a1", title: "Wohnzimmer von Hand auf 80 %", why: "Taster, App oder Automation – Rollwerk merkt sich das als Übersteuerung" },
        { ts: T(10), cat: "shutter", mod: "rollwerk", room: "a1", title: "Wohnzimmer: Automatik wartet", why: "wollte 40 % (Abends Stufe 1 (Sonne ab 250°)) – bleibt, weil von Hand verstellt" },
        { ts: T(5), cat: "shutter", mod: "rollwerk", rn: "Küche", title: "Küche Links auf 40 %", why: "Abends Stufe 1 (Sonne ab 250°) · vorher 100 %" },
        { ts: T(95), cat: "presence", title: "Wieder jemand zu Hause", why: "Zu Hause: Jens" },
        { ts: T(80), cat: "target", room: "a1", title: "Start: Ziel 21,0 °C", why: "Komfort – Komfortzeit laut eigenem Heizplan" },
        { ts: T(80), cat: "command", room: "a1", title: "Thermostat Wohnzimmer → 21,0 °C", why: "Ziel 21,0 °C · Komfort" },
        { ts: T(42), cat: "window", room: "b2", title: "Fenster Bad geöffnet" },
        { ts: T(41), cat: "window", room: "b2", title: "Fensterpause beginnt", why: "Fenster Bad offen · Thermostate auf Frostschutz" },
        { ts: T(41), cat: "target", room: "b2", title: "Ziel 7,0 °C", why: "Fenster offen" },
        { ts: T(20), cat: "health", room: "b2", title: "Thermostat Bad nicht erreichbar", why: "climate.bad · Zustand unavailable" },
        { ts: T(6), cat: "manual", room: "a1", title: "Boost für 30 Min.", why: "bis 21:00 · im Panel · von Jens" },
        { ts: T(11), cat: "notify", room: "b2", title: "Fenster lange offen", why: "Bad: seit 31 Min. offen · gesendet an Pixel 8" },
        { ts: T(3), cat: "notify", room: "a1", title: "Batterie schwach", why: "Thermostat Wohnzimmer Batterie (Wohnzimmer): 14 % · gesendet an Pixel 8" },
      ] };
    }
    throw new Error("unbekannt: " + msg.type);
  },
  callService: async (domain, service, data, target) => { (window.hwSent = window.hwSent || []).push({ type: "call_service", domain, service, service_data: data, target }); },
  connection: { subscribeMessage: (cb, msg) => { wsLog.push(msg.type); return Promise.resolve(() => {}); } },
};
