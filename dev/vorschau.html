            "sensor.waermepumpe_energie": use * 0.35, "sensor.kuehlschrank_energie": use * 0.06 }[id] || 0;
          out[id].push({ start: t, end: t + step, change: v });
        }
      }
      return out;
    }
    if (msg.type === "hauswerk/notify/test") return { results: (msg.channels || []).map((c) => ({ channel: c, ok: true })) };
    if (msg.type === "person/create") { states["person." + msg.name.toLowerCase()] = st("unknown", { friendly_name: msg.name }); return { id: msg.name.toLowerCase(), name: msg.name }; }
    if (msg.type === "hauswerk/log/get") {
      const T = (m) => Date.now() / 1000 - m * 60;
      return { days: 14, entries: [
        { ts: T(26 * 60), cat: "settings", title: "Einstellungen geändert", why: "Frostschutz, Darstellung · Panel · von Jens" },
        { ts: T(50), cat: "settings", mod: "rollwerk", title: "Profil „Süd mit Hitze“ geändert", why: "Zwei Stufen aus → an, Stufe 1 50 % → 40 %, Beschatten ab außen 22 °C → 21 °C · 2 Rollläden · Panel · von Jens" },
        { ts: T(35), cat: "shutter", mod: "rollwerk", room: "a1", title: "Wohnzimmer auf 25 %", why: "Beschattung · vorher 100 %" },
        { ts: T(20), cat: "manual", mod: "rollwerk", room: "a1", title: "Wohnzimmer von Hand auf 80 %", why: "Taster, App oder Automation – Rollwerk merkt sich das als Übersteuerung" },
        { ts: T(10), cat: "shutter", mod: "rollwerk", room: "a1", title: "Wohnzimmer: Automatik wartet", why: "wollte 40 % (Abends Stufe 1 (Sonne ab 250°)) – bleibt, weil von Hand verstellt" },
        { ts: T(5), cat: "shutter", mod: "rollwerk", rn: "Küche", title: "Küche Links auf 40 %", why: "Abends Stufe 1 (Sonne ab 250°) · vorher 100 %" },
        { ts: T(95), cat: "presence", title: "Wieder jemand zu Hause", why: "Zu Hause: Jens" },
        { ts: T(80), cat: "target", room: "a1", title: "Start: Ziel 21,0 °C", why: "Komfort – Komfortzeit laut eigenem Heizplan" },
        { ts: T(80), cat: "command", room: "a1", title: "Thermostat Wohnzimmer → 21,0 °C", why: "Ziel 21,0 °C · Komfort" },
        { ts: T(42), cat: "window", room: "b2", title: "Fenster Bad geöffnet" },
        { ts: T(41), cat: "window", room: "b2", title: "Fensterpause beginnt", why: "Fenster Bad offen · Thermostate auf Frostschutz" },
        { ts: T(41), cat: "target", room: "b2", title: "Ziel 7,0 °C", why: "Fenster offen" },
        { ts: T(20), cat: "health", room: "b2", title: "Thermostat Bad nicht erreichbar", why: "climate.bad · Zustand unavailable" },
        { ts: T(6), cat: "manual", room: "a1", title: "Boost für 30 Min.", why: "bis 21:00 · im Panel · von Jens" },
        { ts: T(11), cat: "notify", room: "b2", title: "Fenster lange offen", why: "Bad: seit 31 Min. offen · gesendet an Pixel 8" },
        { ts: T(3), cat: "notify", room: "a1", title: "Batterie schwach", why: "Thermostat Wohnzimmer Batterie (Wohnzimmer): 14 % · gesendet an Pixel 8" },
      ] };
    }
    throw new Error("unbekannt: " + msg.type);
  },
  callApi: async (method, path) => {
    const id = path.split("?")[0].split("/")[1];
    const d = (k, h, m) => { const x = new Date(); x.setDate(x.getDate() + k); x.setHours(h, m, 0, 0); return x; };
    const day = (k) => { const x = new Date(); x.setDate(x.getDate() + k); return x.toLocaleDateString("sv-SE"); };
    if (id === "calendar.familie") return [
      { summary: "Elternabend", start: { dateTime: new Date(Date.now() + 3600e3).toISOString() }, end: { dateTime: new Date(Date.now() + 9000e3).toISOString() }, location: "Grundschule" },
      { summary: "Kinderturnen", start: { dateTime: d(1, 16, 0).toISOString() }, end: { dateTime: d(1, 17, 0).toISOString() } },
      { summary: "Oma Geburtstag", start: { date: day(4) }, end: { date: day(5) } }];
    if (id === "calendar.muell") return [{ summary: "Restabfall", start: { date: day(1) }, end: { date: day(2) } }, { summary: "Papier", start: { date: day(5) }, end: { date: day(6) } }];
    return [];
  },
  callService: async (domain, service, data, target) => { (window.hwSent = window.hwSent || []).push({ type: "call_service", domain, service, service_data: data, target }); },
  connection: { subscribeMessage: (cb, msg) => {
    wsLog.push(msg.type);
    if (msg.type === "weather/subscribe_forecast") {
      const conds = ["cloudy", "partlycloudy", "rainy", "sunny", "clear-night", "snowy", "partlycloudy"];
      const now = new Date(); now.setMinutes(0, 0, 0);
      const fc = msg.forecast_type === "hourly"
        ? Array.from({ length: 30 }, (_, i) => { const d = new Date(now.getTime() + i * 3600e3); const h = d.getHours();
            return { datetime: d.toISOString(), condition: i >= 5 && i <= 8 ? "rainy" : h >= 17 || h < 7 ? "clear-night" : "partlycloudy",
              temperature: Math.round((3 + 4 * Math.sin(((h - 9) / 24) * 2 * Math.PI) - i * 0.08) * 10) / 10, precipitation_probability: i >= 4 && i <= 9 ? 40 + i * 5 : i % 7 === 0 ? 10 : 0,
              wind_speed: 12, wind_gust_speed: i === 12 ? 62 : 28 }; })
        : Array.from({ length: 7 }, (_, i) => { const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(12);
            return { datetime: d.toISOString(), condition: conds[i], temperature: [5, 4, 7, 9, 3, 1, 6][i], templow: [-1, -3, 2, 4, -2, -4, 0][i],
              precipitation: [0, 0, 6.5, 1.2, 0, 2, 0][i], precipitation_probability: [10, 5, 85, 40, 10, 60, 20][i], wind_speed: [10, 8, 22, 18, 9, 12, 15][i] }; });
      setTimeout(() => cb({ forecast: fc }), 0);
    }
    return Promise.resolve(() => {});
  } },
};
